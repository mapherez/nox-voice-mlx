[project]
name = "personaplex-mlx"
version = "0.1.0"
description = "Real-time voice conversation AI on Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "mcruz" }
]
keywords = ["mlx", "apple-silicon", "voice", "ai", "personaplex"]

dependencies = [
    "mlx>=0.21.0",
    "moshi-mlx>=0.2.2",
    "rustymimi>=0.2.2",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "numpy>=1.24.0",
    "torch>=2.0.0",
    "sentencepiece>=0.1.99",
    "huggingface-hub>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "ruff>=0.1.0",
]

[project.scripts]
personaplex = "live_server_mlx:main"

[tool.uv.scripts]
serve = "python live_server_mlx.py"
test = "python test_pytorch_mlx_comparison.py"
download-weights = """python -c "
from huggingface_hub import snapshot_download
import os

print('Downloading PersonaPlex weights from HuggingFace...')
print('This will download ~17GB of model weights.')
print()

snapshot_download(
    'nvidia/personaplex-7b-v1',
    local_dir='weights',
    ignore_patterns=['*.md', '*.txt', 'figures/*']
)

print()
print('Done! Weights saved to weights/')
"
"""

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

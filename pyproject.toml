[project]
name = "nox-voice-development"
version = "0.1.0"
requires-python = ">=3.12"

[tool.uv]
package = false

[dependency-groups]
dev = ["nox-voice-gateway", "nox-voice-mac", "pytest>=8.3", "pytest-asyncio>=0.25", "ruff>=0.11", "pip-audit>=2.9"]

[tool.uv.sources]
nox-voice-gateway = { path = "gateway", editable = true }
nox-voice-mac = { path = "mac", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "--ignore=tests/mac/test_pytorch_mlx_comparison.py"

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["vendor", "mac/engine/personaplex_mlx", "mac/engine/convert_weights.py", "tests/mac/test_pytorch_mlx_comparison.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

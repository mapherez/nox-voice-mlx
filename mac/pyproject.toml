[project]
name = "nox-voice-mac"
version = "0.1.0"
description = "Native macOS controller and PersonaPlex MLX engine"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.162", "uvicorn[standard]>=0.35", "httpx2>=2.16", "websockets>=15", "cryptography>=46", "psutil>=7", "jsonschema>=4.26,<5"]

[project.optional-dependencies]
engine = ["mlx>=0.32; sys_platform == 'darwin'", "moshi-mlx==0.3.0; sys_platform == 'darwin'", "rustymimi==0.4.1", "torch>=2.10.0", "numpy>=2.1,<2.3", "sentencepiece>=0.2.1", "huggingface-hub>=1.0"]

# The upstream package also pins its unused standalone web/audio client stack.
# This application imports only models/modules/sampling and uses the browser for I/O.
# Keep its inference code pinned, replace stale parser/runtime pins, and omit
# the unused aiohttp/sounddevice/sphn servers. See docs/architecture.md.
[tool.uv]
override-dependencies = ["mlx>=0.32; sys_platform == 'darwin'", "huggingface-hub>=1.0", "sentencepiece>=0.2.1", "safetensors>=0.6"]
exclude-dependencies = ["aiohttp", "sounddevice", "sphn"]

[project.scripts]
nox-voice = "controller.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["controller", "engine"]

name: Webapp checks and Docker image
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nox-voice-mlx-ci-${{ github.event_name == 'push' && contains(github.event.head_commit.message, 'nox-voice-mlx-Release:') && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Select CI work
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - name: Recognize a version-only release request
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          mode=full
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            mode=$(node scripts/ci-policy.mjs classify "$GITHUB_SHA")
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

  policy:
    name: CI reuse policy tests
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - run: node --test scripts/ci-policy.test.mjs scripts/release.test.mjs
      - run: node --test scripts/audit-security.test.mjs

  checks:
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.13.1"
          python-version: "3.12"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: frontend/.node-version
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: uv sync --frozen
      - run: uv run --frozen ruff check .
      - run: uv run --frozen pytest -q
      - run: uv run --frozen pip-audit --skip-editable --progress-spinner off
      - run: npm ci
        working-directory: frontend
      - run: npm run audit:security
        working-directory: frontend
      - run: npm test
        working-directory: frontend
      - run: npm run check
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Build runtime image for startup checks
        run: docker build -f deploy/webapp.Dockerfile -t nox-voice-webapp:ci .
      - name: Verify private secret mounts and unprivileged server
        run: uv run --frozen pytest -q tests/deploy/test_container_startup.py
        env:
          NOX_VOICE_CONTAINER_TEST_IMAGE: nox-voice-webapp:ci

  formatting:
    name: Formatting
    needs: plan
    if: needs.plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "26"
          package-manager-cache: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run format:check
      - run: npm run test:format

  approved:
    name: CI approved
    needs: [plan, policy, checks, formatting]
    if: ${{ !cancelled() && needs.plan.outputs.mode == 'full' }}
    runs-on: ubuntu-latest
    steps:
      - name: Require every source gate
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node -e 'const jobs = JSON.parse(process.env.RESULTS); if (Object.values(jobs).some(job => job.result !== "success")) process.exit(1)'
